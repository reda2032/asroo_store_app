name: asroo_store_app
description: "Asroo Store App"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.9.2


dependencies:
  flutter:
    sdk: flutter
    #language
  flutter_localizations:
    sdk: flutter

  # language
  # Core
  connectivity_plus: ^7.0.0
  flutter_dotenv: ^6.0.0
  flutter_screenutil: ^5.9.3
  flutter_native_splash: ^2.4.7
  # UI
  # Bloc
  # shared preferences
  # freezed

  cupertino_icons: ^1.0.8
  #Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  rename: ^3.1.0





dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.0.0
  flutter_launcher_icons: ^0.14.4


  flutter_lints: ^6.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.jpg"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/play_store_512.png"

flutter:


  uses-material-design: true


  assets:
    - .env.dev
    - .env.prod
    - assets/images/core/
    - lang/ar.json
    - lang/en.json


  fonts:
    # Arabic Font
    - family: Cairo
      fonts:
        - asset: assets/fonts/arabic/cairo/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/arabic/cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/arabic/cairo/Cairo-Regular.ttf
          weight: 400
    # English Font
    - family: Poppins
      fonts:
        - asset: assets/fonts/english/poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/english/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/english/poppins/Poppins-Regular.ttf
          weight: 400

